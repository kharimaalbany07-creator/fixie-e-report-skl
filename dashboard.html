<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Fixie</title>
    <link rel="shortcut icon" href="assets/Group 1148.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="bg">

        <img class="deco-blue" src="assets/pixel_art_large (1).png" alt="">
        <img class="deco-pink" src="assets/pixel_art_large.png" alt="">

    </div>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="assets/Group 1148.png" alt="">
            Fixie
        </a>

        <nav class="navbar-dash">
            <a href="index.html">Report</a>
            <a href="dashboard.html" class="active">Dashboard</a>
        </nav>
    </header>

    <main class="dashboard">

        <div class="dashboard-title">
            <img src="assets/Group 1148.png" alt="">
            <h1>Dashboard</h1>
        </div>

        <section class="stats">
            <div class="card">
                <p>Total Reports</p>
                <strong data-count="semua">05</strong>
            </div>

            <div class="card menunggu">
                <p>Pending</p>
                <strong data-count="menunggu">03</strong>
            </div>

            <div class="card selesai">
                <p>Completed</p>
                <strong data-count="selesai">02</strong>
            </div>
        </section>

        <section class="filters">
            <button class="chip active" data-filter="semua">
                All (<span data-count="semua">5</span>)
            </button>

            <button class="chip" data-filter="menunggu">
                Pending (<span data-count="menunggu">3</span>)
            </button>

            <button class="chip" data-filter="selesai">
                Completed (<span data-count="selesai">2</span>)
            </button>
        </section>

        <section class="table-wrap">
            <table class="table">
                <thead>
                    <tr class="row head">
                        <th>Reporter</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="reports-table-body">
                    
                        <td><span id="status" class="badge"></span></td>
                </tbody>
            </table>

            <p class="empty">No reports found in this category.</p>
        </section>

    </main>

    
     <script src="js/data.js"></script>
    <script src="js/app.js"></script>


</body>

</html>
